name: Build Portable ZIPs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x86_64:
    name: Windows (x86_64)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      BINDGEN_EXTRA_CLANG_ARGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download libusb-1.0.dll (Windows x64)
        shell: pwsh
        run: |
          $LibusbDir = Join-Path $PWD "target\libusb-win64"
          New-Item -ItemType Directory -Force -Path $LibusbDir | Out-Null
          $Archive = Join-Path $LibusbDir "libusb-1.0.27.7z"
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z" -OutFile $Archive -UseBasicParsing
          7z x $Archive "-o$LibusbDir" -y | Out-Null
          $Dll = Get-ChildItem -Path $LibusbDir -Filter "libusb-1.0.dll" -Recurse -File |
            Where-Object { $_.FullName -match "MS64[\\/]dll" } |
            Select-Object -First 1
          if (-not $Dll) { throw "Could not find MS64 libusb-1.0.dll in archive" }
          New-Item -ItemType Directory -Force -Path "target\release" | Out-Null
          Copy-Item $Dll.FullName -Destination "target\release\libusb-1.0.dll" -Force
          echo "LIBUSB_DLL_PATH=$($Dll.FullName)" >> $env:GITHUB_ENV

      - name: Build & Package Portable ZIP
        shell: pwsh
        run: .\scripts\package_portable.ps1

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: oakd-lite-studio-win64-portable
          path: dist/oakd-lite-studio-win64-portable.zip

  build-linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build nasm pkg-config git clang libclang-dev zip \
            libusb-1.0-0-dev libudev-dev libdw-dev libelf-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build & Package Portable ZIP
        run: |
          chmod +x scripts/package_portable.sh
          ./scripts/package_portable.sh

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: oakd-lite-studio-linux-${{ matrix.arch }}-portable
          path: dist/oakd-lite-studio-linux-${{ matrix.arch }}-portable.zip

  build-macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            libclang_path: /opt/homebrew/opt/llvm/lib
          - arch: x86_64
            runner: macos-15-intel
            libclang_path: /usr/local/opt/llvm/lib
    runs-on: ${{ matrix.runner }}
    env:
      LIBCLANG_PATH: ${{ matrix.libclang_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install cmake ninja nasm pkg-config libusb llvm opencv

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Pre-build depthai-core v3.6.1 (macOS)
        run: |
          DAI_BUILD_DIR="target/dai-build/v3.6.1"
          OPENCV_PREFIX="$(brew --prefix opencv)"
          BREW_PREFIX="$(brew --prefix)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=${SDK_PATH}" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot ${SDK_PATH} -I${SDK_PATH}/usr/include/c++/v1 -I${OPENCV_PREFIX}/include/opencv4" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${OPENCV_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

          if [ ! -f "${DAI_BUILD_DIR}/libdepthai-core.a" ]; then
            mkdir -p "${DAI_BUILD_DIR}"
            if [ ! -d "${DAI_BUILD_DIR}/depthai-core" ]; then
              git clone --branch v3.6.1 --recursive https://github.com/luxonis/depthai-core.git "${DAI_BUILD_DIR}/depthai-core"
            fi
            cmake -S "${DAI_BUILD_DIR}/depthai-core" -B "${DAI_BUILD_DIR}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DDEPTHAI_BUILD_DOCS=OFF \
              -DDEPTHAI_BUILD_EXAMPLES=OFF \
              -DDEPTHAI_BUILD_TESTS=OFF \
              -DDEPTHAI_OPENCV_SUPPORT=ON \
              -DDEPTHAI_DYNAMIC_CALIBRATION_SUPPORT=OFF \
              -DDEPTHAI_ENABLE_EVENTS_MANAGER=ON \
              -DOpenCV_DIR="${OPENCV_PREFIX}/lib/cmake/opencv4" \
              -DCMAKE_PREFIX_PATH="${OPENCV_PREFIX};${BREW_PREFIX}" \
              -DCMAKE_FIND_ROOT_PATH="${OPENCV_PREFIX};${BREW_PREFIX}"
            cmake --build "${DAI_BUILD_DIR}" --parallel
          fi

          # Stage shared bootloader & OpenCV headers into depthai-core/include for depthai-sys autocxx on macOS
          if [ -d "${DAI_BUILD_DIR}/depthai-core/shared/depthai-bootloader-shared/include" ]; then
            cp -Rn "${DAI_BUILD_DIR}/depthai-core/shared/depthai-bootloader-shared/include/"* "${DAI_BUILD_DIR}/depthai-core/include/" || true
          fi
          if [ -d "${DAI_BUILD_DIR}/depthai-core/shared/depthai-shared/include" ]; then
            cp -Rn "${DAI_BUILD_DIR}/depthai-core/shared/depthai-shared/include/"* "${DAI_BUILD_DIR}/depthai-core/include/" || true
          fi
          if [ -d "${OPENCV_PREFIX}/include/opencv4/opencv2" ] && [ ! -e "${DAI_BUILD_DIR}/depthai-core/include/opencv2" ]; then
            ln -s "${OPENCV_PREFIX}/include/opencv4/opencv2" "${DAI_BUILD_DIR}/depthai-core/include/opencv2"
          fi

          mkdir -p target/release
          cp -f "${DAI_BUILD_DIR}/libdepthai-core.a" target/release/libdepthai-core.a

      - name: Build & Package Portable ZIP
        run: |
          chmod +x scripts/package_portable.sh
          ./scripts/package_portable.sh

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: oakd-lite-studio-macos-${{ matrix.arch }}-portable
          path: dist/oakd-lite-studio-macos-${{ matrix.arch }}-portable.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-x86_64, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all portable ZIPs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release & Attach ZIPs
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
