name: Build Portable ZIPs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x86_64:
    name: Windows (x86_64)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      BINDGEN_EXTRA_CLANG_ARGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download libusb-1.0.dll (Windows x64)
        shell: pwsh
        run: |
          $LibusbDir = Join-Path $PWD "target\libusb-win64"
          New-Item -ItemType Directory -Force -Path $LibusbDir | Out-Null
          $Archive = Join-Path $LibusbDir "libusb-1.0.27.7z"
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z" -OutFile $Archive -UseBasicParsing
          7z x $Archive "-o$LibusbDir" -y | Out-Null
          $Dll = Get-ChildItem -Path $LibusbDir -Filter "libusb-1.0.dll" -Recurse -File |
            Where-Object { $_.FullName -match "MS64[\\/]dll" } |
            Select-Object -First 1
          if (-not $Dll) { throw "Could not find MS64 libusb-1.0.dll in archive" }
          New-Item -ItemType Directory -Force -Path "target\release" | Out-Null
          Copy-Item $Dll.FullName -Destination "target\release\libusb-1.0.dll" -Force
          echo "LIBUSB_DLL_PATH=$($Dll.FullName)" >> $env:GITHUB_ENV

      - name: Build & Package Portable ZIP
        shell: pwsh
        run: .\scripts\package_portable.ps1

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: oakd-lite-studio-win64-portable
          path: dist/oakd-lite-studio-win64-portable.zip

  build-linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build nasm pkg-config git clang libclang-dev zip \
            libusb-1.0-0-dev libudev-dev libdw-dev libelf-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build & Package Portable ZIP
        run: |
          chmod +x scripts/package_portable.sh
          ./scripts/package_portable.sh

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: oakd-lite-studio-linux-${{ matrix.arch }}-portable
          path: dist/oakd-lite-studio-linux-${{ matrix.arch }}-portable.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-x86_64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all portable ZIPs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release & Attach ZIPs
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
